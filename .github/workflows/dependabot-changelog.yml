name: Dependabot Changelog Entry

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  update-changelog:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write # needed for pushing changes

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: crambl/dependabot-changelog-writer@478f44ae023312b697349f9d12b646936020936f # v1.3.1
      with:
        section-header: 'DEPENDENCIES'
        changelog-entry-pattern: 'Bump [dep] from [old] to [new] ([pr-link])'
