# source: https://docs.github.com/en/enterprise-cloud@latest/actions/publishing-packages/publishing-docker-images
name: Create and publish a Docker image

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    tags:
      - "v[0-9]+\\.[0-9]+\\.[0-9]+"
      - "v[0-9]+\\.[0-9]+\\.[0-9]+-rc[0-9]+"
  workflow_dispatch:
  pull_request:
    types: [labeled]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'interchaintest' }}
    permissions:
      contents: write
      packages: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get new commits for nightly build
        run: echo "NEW_COMMIT_COUNT=$(git log --oneline --since '24 hours ago' | wc -l)" >> $GITHUB_ENV
        if: "${{ env.GITHUB_EVENT_NAME == 'schedule' }}"

      - name: Set new commits for other builds
        run: echo "NEW_COMMIT_COUNT=1" >> $GITHUB_ENV
        if: "${{ env.GITHUB_EVENT_NAME != 'schedule' }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: "latest=false"

      - name: Build and push docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # mode=min caches only the final image layers. mode=max would cache
          # all intermediate layers too, but the GHA cache is a shared 10GB
          # repo-wide pool with LRU eviction — a large image cache would evict
          # the Go module/build caches the lint/test/sims jobs rely on.
          cache-to: type=gha,mode=min
        if: ${{ env.NEW_COMMIT_COUNT > 0 }}

      - name: Dispatch Interchain test
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          event-type: image-pushed
          client-payload: |
            {
              "tag_name": "${{ fromJson(steps.meta.outputs.json)['labels']['org.opencontainers.image.version'] }}",
              "ref_name": "${{ fromJson(steps.meta.outputs.json)['labels']['org.opencontainers.image.revision'] }}",
              "pr_number": "${{ github.event.pull_request.number }}",
              "pr_head_sha": "${{ github.event.pull_request.head.sha }}"
            }
        if: ${{ env.NEW_COMMIT_COUNT > 0 }}
