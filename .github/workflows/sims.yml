name: Sims
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

# Static group (not github.workflow) so it stays stable whether this workflow
# runs directly or is called via workflow_call — in a
# reusable call github.workflow resolves to the caller, which would otherwise
# collide with the caller's own concurrency group.
concurrency:
  group: sims-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cleanup-runs:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: rokroskar/workflow-run-cleanup-action@c631227427d0452af4994af0940d7655ebc50c7c # master
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
    if: "!startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main'"

  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-runsim-binary-v1.0.0
      - name: Install runsim
        run: go install github.com/cosmos/tools/cmd/runsim@v1.0.0

  test-sim-nondeterminism:
    runs-on: ubuntu-22.04
    needs: build
    permissions:
      contents: read
      pull-requests: read
    # TestAppStateDeterminism is CPU-bound, single-threaded, and re-runs the
    # full simulation numSeeds*numTimesToRunPerSeed (3*5=15) times. Passing a
    # fixed -Seed forces numSeeds=1, so each matrix job runs a single seed (5
    # runs) in parallel instead of all 15 sequentially in one job. This cuts
    # wall-clock ~3x while preserving total coverage. Seeds must be != 42
    # (simcli DefaultSeedValue), which would re-enable the internal 3-seed loop.
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: git_diff
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-runsim-binary-v1.0.0
        if: steps.git_diff.outputs.go == 'true'
      - name: test nondeterminism
        run: |
          make test-sim-nondeterminism SIM_SEED=${{ matrix.seed }}
        if: steps.git_diff.outputs.go == 'true'



